# Reusable SonarQube Cloud scan. It does not build or test anything: it downloads the
# coverage artifacts that the language CI jobs uploaded (coverage-*), and scans.
#
# Skips cleanly (green, with a notice) when SONAR_TOKEN is unavailable: Dependabot PRs,
# fork PRs, or repos without the secret.
#
# Report paths are passed on the command line (they override sonar-project.properties), so a
# stale `*.reportPaths` in a repo's properties file cannot silently drop coverage to 0%:
#   coverage/lcov-rust.info -> sonar.rust.lcov.reportPaths
#   coverage/go.out         -> sonar.go.coverage.reportPaths
#   coverage/python.xml     -> sonar.python.coverage.reportPaths
#   coverage/lcov-js.info   -> sonar.javascript.lcov.reportPaths
#   coverage/cpp.xml        -> sonar.coverageReportPaths (generic format, e.g. gcovr --sonarqube)
# Only files that were actually downloaded are passed. Set `report-paths: false` to opt out.
#
# Template pins: rule githubactions:S7637 wants every `uses:` pinned to a full commit SHA, and
# flags the `@v1` references to these templates (a Security issue: rating C, failed gate). The
# scan ignores that rule in .github/workflows/** (multicriteria id `ciTemplatesPins`). A -D
# argument replaces the same key in sonar-project.properties, so the ids already listed in
# `sonar.issue.ignore.multicriteria` there (or in `args`) are read and kept; their
# `.ruleKey` / `.resourceKey` keys are not touched. Limitation: ids defined only in the
# SonarQube Cloud UI are not visible to the scan; move them to sonar-project.properties.
# Third-party actions are still pinned by SHA in the templates. `ignore-template-pins: false`
# turns this off.
#
# Caller example:
#   sonar:
#     needs: [rust]
#     uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
#     secrets:
#       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
name: Sonar

on:
  workflow_call:
    inputs:
      coverage-pattern:
        description: Artifact name pattern to download into coverage/ (empty = none).
        type: string
        default: coverage-*
      project-version:
        description: >-
          sonar.projectVersion. Empty = not passed; `auto` = the version in the root Cargo.toml
          ([package] or [workspace.package]), package.json or pyproject.toml. Do not hard-code it in
          sonar-project.properties.
        type: string
        default: ""
      args:
        description: Extra scanner arguments (e.g. -Dsonar.qualitygate.wait=true).
        type: string
        default: ""
      report-paths:
        description: Pass the report path of every downloaded coverage file (see header).
        type: boolean
        default: true
      ignore-template-pins:
        description: >-
          Ignore githubactions:S7637 ("use a full commit SHA") in .github/workflows/**, so the @v1
          references to these templates do not fail the quality gate (see header).
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 15
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    # Secrets are not passed to Dependabot or fork PR runs; skip instead of failing.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN is not available to this run; skipping the scan."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage
        if: steps.token.outputs.present == 'true' && inputs.coverage-pattern != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.coverage-pattern }}
          path: coverage
          merge-multiple: true
      # Python so the logic can be unit-tested: tests/sonar_args_test.py runs this exact step.
      - name: Build scanner arguments
        if: steps.token.outputs.present == 'true'
        id: args
        shell: python3 {0}
        env:
          VERSION: ${{ inputs.project-version }}
          EXTRA: ${{ inputs.args }}
          AUTO: ${{ inputs.report-paths }}
          IGNORE_PINS: ${{ inputs.ignore-template-pins }}
        run: |
          import json, os, pathlib, re, tomllib

          MC = "sonar.issue.ignore.multicriteria"
          PIN_ID = "ciTemplatesPins"
          REPORTS = [  # coverage/<file> -> property
              ("lcov-rust.info", "sonar.rust.lcov.reportPaths"),
              ("go.out", "sonar.go.coverage.reportPaths"),
              ("python.xml", "sonar.python.coverage.reportPaths"),
              ("lcov-js.info", "sonar.javascript.lcov.reportPaths"),
              ("cpp.xml", "sonar.coverageReportPaths"),
          ]


          def arg_value(text, key):
              """Value of -D<key>=... in an argument string ("..." / '...' quoting allowed)."""
              m = re.search(rf"(?:^|\s)-D{re.escape(key)}=(\"[^\"]*\"|'[^']*'|\S*)", text)
              return None if m is None else m.group(1).strip("\"'")


          def read_properties(path):
              """Minimal java.util.Properties reader: comments, = / : / blank separators, \\ continuations."""
              props, logical = {}, None
              try:
                  lines = pathlib.Path(path).read_text(encoding="utf-8").splitlines()
              except OSError:
                  return props
              for raw in lines:
                  line = raw.lstrip()
                  if logical is None and (not line or line[0] in "#!"):
                      continue
                  trailing = len(line) - len(line.rstrip("\\"))
                  part = line[:-1] if trailing % 2 else line
                  logical = part if logical is None else logical + part
                  if trailing % 2:
                      continue
                  m = re.match(r"((?:\\.|[^\s=:\\])*)\s*[=:]?\s*(.*)$", logical, re.S)
                  props[re.sub(r"\\(.)", r"\1", m.group(1))] = m.group(2)
                  logical = None
              return props


          def manifest_version():
              """version of the root Cargo.toml ([package] or [workspace.package]), package.json or pyproject.toml."""
              try:
                  cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
                  v = (cargo.get("package") or {}).get("version")
                  if not isinstance(v, str):
                      v = ((cargo.get("workspace") or {}).get("package") or {}).get("version")
                  if isinstance(v, str):
                      return v
              except (OSError, tomllib.TOMLDecodeError):
                  pass
              try:
                  v = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8")).get("version")
                  if isinstance(v, str):
                      return v
              except (OSError, ValueError, AttributeError):
                  pass
              try:
                  v = (tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8")).get("project") or {}).get("version")
                  if isinstance(v, str):
                      return v
              except (OSError, tomllib.TOMLDecodeError):
                  pass
              return None


          extra = os.environ.get("EXTRA", "").strip()
          version = os.environ.get("VERSION", "").strip()
          args = []

          # Ignore githubactions:S7637 (full-SHA pins) for the @v1 template references. A -D on the
          # command line replaces the properties-file key, so the ids the repo already lists (in
          # sonar-project.properties or in `args`) are merged in; their per-id keys stay untouched.
          if os.environ.get("IGNORE_PINS") == "true":
              settings = arg_value(extra, "project.settings") or "sonar-project.properties"
              ids = []
              for src in (read_properties(settings).get(MC), arg_value(extra, MC), PIN_ID):
                  for i in (src or "").split(","):
                      if i.strip() and i.strip() not in ids:
                          ids.append(i.strip())
              extra = re.sub(rf"(?:^|\s)-D{re.escape(MC)}=(\"[^\"]*\"|'[^']*'|\S*)", "", extra).strip()
              args += [
                  f"-D{MC}={','.join(ids)}",
                  f"-D{MC}.{PIN_ID}.ruleKey=githubactions:S7637",
                  f"-D{MC}.{PIN_ID}.resourceKey=.github/workflows/**",
              ]

          if version == "auto":
              version = manifest_version() or ""
              if not version:
                  print("::notice::project-version: auto found no version in Cargo.toml, package.json or pyproject.toml")
          if version:
              args.append(f"-Dsonar.projectVersion={version}")

          if os.environ.get("AUTO") == "true":
              args += [f"-D{prop}=coverage/{f}" for f, prop in REPORTS if pathlib.Path("coverage", f).is_file()]

          line = " ".join(([extra] if extra else []) + args)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"args={line}\n")
          print(f"scanner args: {line}")
          cov = pathlib.Path("coverage")
          print("coverage files:", ", ".join(sorted(p.name for p in cov.iterdir())) if cov.is_dir() else "none")
      - name: SonarQube scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.args.outputs.args }}
