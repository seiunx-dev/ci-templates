# Reusable GitHub Release publisher. Downloads the same-run artifacts that match
# `artifact-pattern` (release archives, wheels, npm tarballs, ...), writes
# SHA256SUMS-<tag>.txt and creates/updates the release. Only this job gets
# contents: write; the build jobs that ran third-party build scripts never do.
# Pre-release tags (containing '-') become pre-releases and never "latest".
name: GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish (usually needs.gate.outputs.tag).
        type: string
        required: true
      prerelease:
        description: "'true' / 'false' (usually needs.gate.outputs.prerelease)."
        type: string
        default: "false"
      artifact-pattern:
        description: Artifact name pattern to attach (empty = release without assets).
        type: string
        default: release-*
      files:
        description: Globs (relative to the download dir) of files to attach, one per line.
        type: string
        default: "*"
      checksums:
        type: boolean
        default: true
      body-path:
        description: Curated notes file ({tag} is substituted, e.g. docs/releases/{tag}.md); used when it exists, else notes are generated.
        type: string
        default: ""
      draft:
        type: boolean
        default: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.body-path != ''
        with:
          persist-credentials: false
      - name: Download artifacts
        if: inputs.artifact-pattern != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: release-assets
          merge-multiple: true
      - name: Checksums and notes
        id: prep
        env:
          TAG: ${{ inputs.tag }}
          CHECKSUMS: ${{ inputs.checksums }}
          BODY: ${{ inputs.body-path }}
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ "$CHECKSUMS" = true ] && [ -n "$(ls -A release-assets)" ]; then
            (cd release-assets && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | sort | xargs -r sha256sum > "SHA256SUMS-${TAG}.txt")
          fi
          {
            echo "files<<__EOF__"
            while IFS= read -r g; do [ -z "$g" ] || echo "release-assets/$g"; done <<< "$FILES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          body=""
          if [ -n "$BODY" ]; then
            candidate="${BODY//\{tag\}/$TAG}"
            [ -f "$candidate" ] && body="$candidate"
          fi
          echo "body=$body" >> "$GITHUB_OUTPUT"
          ls -la release-assets
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.prep.outputs.files }}
          fail_on_unmatched_files: false
          body_path: ${{ steps.prep.outputs.body }}
          generate_release_notes: ${{ steps.prep.outputs.body == '' }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          make_latest: ${{ inputs.prerelease == 'true' && 'false' || 'true' }}
          draft: ${{ inputs.draft }}
