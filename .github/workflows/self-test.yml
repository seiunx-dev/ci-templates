# CI of the template repository itself: lints every file, then calls the reusable workflows
# of this commit (./.github/workflows/x.yml) on the small fixtures under tests/fixtures/.
#
# Composite actions inside the templates are referenced as seiunx-dev/ci-templates/actions/x@v1,
# so they resolve to the published v1 tag, not to this commit. A change under actions/ is
# exercised here only after v1 has been moved (see README, "发布本仓库").
#
# docker.yml: on pull requests it builds without pushing (it logs in only to read the registry
# build cache, as private repos need). On pushes to main and
# on workflow_dispatch it also runs the defer-moving-tags path against the throwaway image
# ghcr.io/seiunx-dev/ci-templates-selftest: push :sha-* only, check the moving tag did not move,
# pass a stand-in "CI OK" job, move the tag with docker-retag.yml and check it again.
# pages.yml builds with deploy: false. Not exercised: gh-release.yml (creates a release), maturin-wheels.yml (slow;
# covered by the first pilot repo), go-release.yml (needs go.mod at the repository root).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Workflow lint
    uses: ./.github/workflows/actionlint.yml

  yaml:
    name: YAML and caller contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse every YAML file and check calls against workflow_call inputs
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --break-system-packages pyyaml
          python3 tools/check_callers.py
      - name: Unit tests of the sonar.yml argument builder
        run: python3 tests/sonar_args_test.py
      - name: docker-retag.yml ordering guard against stubbed docker / gh
        run: bash tests/docker_retag_test.sh
      - name: verify-version event / ref matrix (only a tag push publishes) and go / none sources
        run: bash tests/verify_version_test.sh

  # rust-ci has two variants of each job: the plain one (no services:/container: keys) runs on
  # Windows/macOS; the services/container one only on Linux.
  rust-windows:
    name: rust-ci on Windows
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: tests/fixtures/rust-min
      runs-on: windows-latest
      fmt: false
      cache-key-prefix: selftest-win
  rust-macos:
    name: rust-ci on macOS
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: tests/fixtures/rust-min
      runs-on: macos-latest
      fmt: false
      cache-key-prefix: selftest-mac
  # Postgres only: the empty redis-image service must be skipped and `container: ''` must run
  # on the runner. Also covers coverage mode, the artifact and extra-test-command.
  rust-services:
    name: rust-ci with Postgres + coverage
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: tests/fixtures/rust-min
      postgres-image: postgres:17-alpine
      coverage: true
      cache-key-prefix: selftest-cov
      msrv: "1.85"
      extra-test-command: $CARGO_TEST --locked -- --ignored service_postgres_reachable
  # Container mode: both jobs in a Debian container, Redis reached by its service name.
  rust-container:
    name: rust-ci in a container + Redis
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: tests/fixtures/rust-min
      container: debian:trixie-slim
      redis-image: redis:7-alpine
      apt-packages: pkg-config
      cache-key-prefix: selftest-ctr
      extra-test-command: $CARGO_TEST --locked -- --ignored service_redis_reachable

  # Redis only (empty postgres-image must be skipped), a Python matrix and uv build.
  python:
    name: python-uv-ci + Redis
    uses: ./.github/workflows/python-uv-ci.yml
    with:
      working-directory: tests/fixtures/py-min
      python-versions: '["3.12", "3.13"]'
      redis-image: redis:7-alpine
      env: |
        EXPECT_REDIS=1
        EXPECT_NO_POSTGRES=1
      build-dist: true

  # Postgres only (empty redis-image must be skipped), coverage + threshold.
  go:
    name: go-ci + Postgres
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: tests/fixtures/go-min
      postgres-image: postgres:17-alpine
      env: EXPECT_SERVICES=1
      test-args: -count=1 -v
      coverage: true
      coverage-threshold: "50"

  node-npm:
    name: node-ci (npm)
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-npm
      upload-build: dist
  node-bun:
    name: node-ci (bun)
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-bun
      test-command: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      coverage-path: coverage/lcov.info

  # Pull requests only: the PR path builds without pushing. Two platforms exercise the QEMU
  # step; pr-paths exercises the changed-files filter; cache-backend: registry exercises the
  # read-only login and the import of the :buildcache that docker-push writes on main.
  docker:
    name: docker (PR build)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/docker.yml
    with:
      image: ghcr.io/seiunx-dev/ci-templates-selftest
      context: tests/fixtures/docker
      platforms: linux/amd64,linux/arm64
      version-build-arg: APP_VERSION
      cache-backend: registry
      build-record: false
      pr-paths: |
        tests/fixtures/docker/**
        .github/workflows/docker.yml
        .github/workflows/self-test.yml

  # Push path with deferred moving tags (never on PRs: PRs do not push). Throwaway image only.
  docker-push:
    name: docker (push, deferred tags)
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/docker.yml
    with:
      image: ghcr.io/seiunx-dev/ci-templates-selftest
      context: tests/fixtures/docker
      version-build-arg: APP_VERSION
      cache-backend: registry
      build-record: false
      defer-moving-tags: true

  # Both docker jobs above set build-record: false, so this run must not carry a .dockerbuild
  # artifact (build-push-action uploads one per build by default).
  docker-build-record:
    name: docker (no build record artifact)
    needs: [docker, docker-push]
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker-push.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check the run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name')
          printf 'artifacts so far:\n%s\n' "$names"
          if grep -q '[.]dockerbuild$' <<< "$names"; then
            echo "::error::a docker job with build-record: false uploaded a build record"; exit 1
          fi

  docker-before:
    name: docker (sha tags pushed, moving tag not yet)
    needs: docker-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      prior-revision: ${{ steps.prior.outputs.revision }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A re-run (or a second run) of a commit finds the branch tag already holding an image of
      # this commit; docker-retag then correctly leaves it alone ("already holds"), and
      # docker-after checks that instead of a move.
      - name: Record the branch tag's revision
        id: prior
        env:
          IMAGE: ${{ needs.docker-push.outputs.image }}
        run: |
          set -euo pipefail
          branch="$IMAGE:${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/-}"
          rev=$(docker buildx imagetools inspect "$branch" --format '{{json .Image}}' 2> /dev/null | jq -r '
            (if has("config") or has("rootfs") then . else
              ([to_entries[] | select(.key != "unknown/unknown") | .value] | first) end)
            | .config.Labels["org.opencontainers.image.revision"] // empty' 2> /dev/null || true)
          echo "$branch revision before retag: ${rev:-<none>}"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - name: Check tags
        env:
          IMAGE: ${{ needs.docker-push.outputs.image }}
          DIGEST: ${{ needs.docker-push.outputs.digest }}
          DEFERRED: ${{ needs.docker-push.outputs.deferred-tags }}
        run: &check-tags |
          set -euo pipefail
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2> /dev/null | jq -r .digest || true; }
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::no digest output: '$DIGEST'"; exit 1; }
          for t in "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:sha-${GITHUB_SHA::7}"; do
            got=$(digest_of "$t"); echo "$t -> $got"
            [ "$got" = "$DIGEST" ] || { echo "::error::$t is not $DIGEST"; exit 1; }
          done
          branch="$IMAGE:${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/-}"
          [ "$(printf '%s' "$DEFERRED")" = "$branch" ] || { echo "::error::deferred-tags is '$DEFERRED', expected '$branch'"; exit 1; }
          got=$(digest_of "$branch"); echo "$branch -> ${got:-<none>}"
          if [ "$PHASE" = before ] && [ "$got" = "$DIGEST" ]; then echo "::error::$branch moved before CI OK"; exit 1; fi
          if [ "$PHASE" = after ] && [ "$got" != "$DIGEST" ]; then echo "::error::$branch was not moved to $DIGEST"; exit 1; fi
          echo "ok ($PHASE)"
    env:
      PHASE: before

  # Stands in for a caller's aggregate "CI OK" job.
  fake-ci-ok:
    name: Fake CI OK
    needs: [docker-push, docker-before]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "tests passed"

  docker-retag:
    name: docker-retag (move the deferred tag)
    needs: [docker-push, fake-ci-ok]
    if: needs.docker-push.outputs.deferred-tags != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-retag.yml
    with:
      image: ${{ needs.docker-push.outputs.image }}
      digest: ${{ needs.docker-push.outputs.digest }}
      tags: ${{ needs.docker-push.outputs.deferred-tags }}

  docker-after:
    name: docker (moving tag moved, no rebuild)
    needs: [docker-push, docker-before, docker-retag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check tags
        env:
          IMAGE: ${{ needs.docker-push.outputs.image }}
          DIGEST: ${{ needs.docker-push.outputs.digest }}
          DEFERRED: ${{ needs.docker-push.outputs.deferred-tags }}
          MOVED: ${{ needs.docker-retag.outputs.moved }}
          PRIOR: ${{ needs.docker-before.outputs.prior-revision }}
        run: |
          if [ "$PRIOR" = "$GITHUB_SHA" ]; then
            # Re-run of this commit: the tag already held it, so nothing may move.
            [ -z "$MOVED" ] || { echo "::error::moved '$MOVED' although the tag already held $GITHUB_SHA"; exit 1; }
            echo "re-run: tag already held ${GITHUB_SHA::7}, left alone"
          else
            [ "$(printf '%s' "$MOVED")" = "$(printf '%s' "$DEFERRED")" ] || { echo "::error::moved '$MOVED' != deferred '$DEFERRED'"; exit 1; }
          fi
      - name: Check registry
        if: needs.docker-before.outputs.prior-revision != github.sha
        env:
          IMAGE: ${{ needs.docker-push.outputs.image }}
          DIGEST: ${{ needs.docker-push.outputs.digest }}
          DEFERRED: ${{ needs.docker-push.outputs.deferred-tags }}
        run: *check-tags
    env:
      PHASE: after

  # Build only (deploy: false). The caller still has to grant pages/id-token because the
  # nested deploy job declares them.
  pages:
    name: pages (build only)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      working-directory: tests/fixtures/node-bun
      build-command: bun run typecheck
      output-dir: dist
      deploy: false

  # No SONAR_TOKEN is passed: the scan must skip and stay green.
  sonar:
    name: Sonar (skip path)
    needs: [rust-services, go, node-bun]
    uses: ./.github/workflows/sonar.yml

  gate:
    name: Release gate (dry run)
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      checks: read
    with:
      version-source: cargo
      version-path: tests/fixtures/rust-min/Cargo.toml
      version-extra-paths: tests/fixtures/py-min/pyproject.toml

  # One cargo target per OS plus a zigbuild leg with a glibc suffix. The fixture is not at the
  # repository root, so the target dir is pointed back to ./target.
  rust-release:
    name: rust-release (dry run)
    needs: gate
    uses: ./.github/workflows/rust-release.yml
    with:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      name: rust-min
      cargo-args: --manifest-path tests/fixtures/rust-min/Cargo.toml
      build-env: CARGO_TARGET_DIR=target
      # Exercise the compile-time-secret guard: a non-empty secret must let the build proceed.
      build-secret-names: GUARD_TEST_SECRET
      require-build-secrets: true
      extra-files: |
        LICENSE
        tests/fixtures/rust-min/Cargo.toml=>docs/Cargo.toml
      targets: >-
        [{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
         {"label":"linux-x64-glibc217","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu.2.17","builder":"zigbuild"},
         {"label":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin","layout":"flat"},
         {"label":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc"}]
    secrets:
      build-secret-1: guard-ok-nonempty # literal, non-empty: the require-build-secrets guard must pass

  # Checks the archives rust-release produced (names, formats, layout, contents).
  release-assets:
    name: Check release archives
    needs: [gate, rust-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Inspect archives
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          ls -l assets
          base="rust-min-$VERSION"
          has() {  # has <listing> <entry>; no `| grep -q` (SIGPIPE under pipefail)
            if ! grep -qxF -- "$2" <<< "$1"; then echo "::error::missing $2"; echo "$1"; exit 1; fi
          }
          linux=$(tar -tzf "assets/$base-linux-x64.tar.gz")
          has "$linux" "$base-linux-x64/rust-min"
          has "$linux" "$base-linux-x64/LICENSE"
          has "$linux" "$base-linux-x64/docs/Cargo.toml"
          zig=$(tar -tzf "assets/$base-linux-x64-glibc217.tar.gz")
          has "$zig" "$base-linux-x64-glibc217/rust-min"
          mac=$(tar -tzf "assets/$base-macos-arm64.tar.gz")
          has "$mac" "rust-min"   # layout: flat
          has "$mac" "docs/Cargo.toml"
          win=$(unzip -Z1 "assets/$base-windows-x64.zip")
          has "$win" "$base-windows-x64/rust-min.exe"
          has "$win" "$base-windows-x64/docs/Cargo.toml"
          # the zigbuild leg must not need a glibc newer than 2.17
          tar -xzf "assets/$base-linux-x64-glibc217.tar.gz" -C "$RUNNER_TEMP"
          syms=$(objdump -T "$RUNNER_TEMP/$base-linux-x64-glibc217/rust-min")
          max=$(grep -o 'GLIBC_[0-9.]*' <<< "$syms" | sort -uV | tail -n1)
          echo "highest glibc symbol version: $max"
          [ "$(printf '%s\n' "$max" GLIBC_2.17 | sort -V | tail -n1)" = GLIBC_2.17 ]

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - lint
      - yaml
      - rust-windows
      - rust-macos
      - rust-services
      - rust-container
      - python
      - go
      - node-npm
      - node-bun
      - docker
      - docker-push
      - docker-build-record
      - docker-before
      - fake-ci-ok
      - docker-retag
      - docker-after
      - pages
      - sonar
      - gate
      - rust-release
      - release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
