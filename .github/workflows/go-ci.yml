# Reusable Go CI: `lint` (gofmt, go vet, staticcheck with the "(compile)" guard,
# go mod tidy -diff, optional govulncheck, go build) and `test` (go test -race, optional
# coverage + threshold, optional Postgres/Redis), plus an optional bun frontend job.
#
# Caches are saved only from the default branch (PRs and tags restore, never write):
# - GOMODCACHE: one entry per go.sum hash, shared by both jobs and saved by Lint when the exact
#   key missed. On the default branch a miss starts empty (no restore-keys fallback), so an
#   entry never carries the module versions of older go.sum files.
# - GOCACHE (Lint: also staticcheck's cache): per job, calling workflow file and
#   working-directory, keyed per commit with go.sum-scoped restore keys, so it is refreshed on
#   every main push instead of freezing at the first go.sum hit (the setup-go default). Before
#   the save, the entries this run did not use are deleted ("Mark" / "Trim" steps), so an entry
#   holds one build's working set instead of growing with every commit.
# An exact hit (a re-run) saves nothing.
#
# The Go version comes from go.mod: its toolchain line when there is one, else the go line.
# setup-go then exports GOTOOLCHAIN=local, so a go.mod newer than the installed toolchain fails
# instead of silently downloading another one. GOTOOLCHAIN must not be set before setup-go:
# with GOTOOLCHAIN=local already in the env, setup-go ignores the toolchain line and installs
# the (older) go line, so CI would test on another Go than the release build uses.
name: Go CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      go-version-file:
        description: File that pins the Go version (go.mod or .go-version).
        type: string
        default: go.mod
      build-flags:
        description: Flags for go build/vet/test (e.g. -mod=readonly).
        type: string
        default: -mod=readonly
      staticcheck:
        description: "auto (go tool staticcheck if go.mod declares it, else go run @staticcheck-version) | off"
        type: string
        default: auto
      staticcheck-version:
        type: string
        default: "2026.2"
      staticcheck-command:
        description: Full override, e.g. "go run -modfile=.github/tools/go.mod honnef.co/go/tools/cmd/staticcheck".
        type: string
        default: ""
      govulncheck:
        description: Run govulncheck (golang.org/x/vuln/cmd/govulncheck@latest).
        type: boolean
        default: false
      tidy-check:
        description: Fail when go mod tidy would change go.mod/go.sum.
        type: boolean
        default: true
      race:
        type: boolean
        default: true
      test-packages:
        type: string
        default: ./...
      test-args:
        type: string
        default: -count=1
      coverage:
        description: Write coverage/go.out (atomic) from the same race test run and upload coverage-go.
        type: boolean
        default: false
      coverpkg-exclude:
        description: Regex of packages to leave out of -coverpkg (e.g. /database/ent). Empty = default coverpkg.
        type: string
        default: ""
      coverage-threshold:
        description: Minimum total statement coverage percent (empty = no gate).
        type: string
        default: ""
      postgres-image:
        type: string
        default: ""
      redis-image:
        type: string
        default: ""
      env:
        description: KEY=VALUE lines for the test job. ${CI_POSTGRES_URL} / ${CI_REDIS_URL} are substituted.
        type: string
        default: ""
      frontend-directory:
        description: Directory of a bun frontend to check (empty = no frontend job).
        type: string
        default: ""
      bun-version:
        description: Bun version for the frontend (e.g. 1.3.14). Empty = bun-version-file or package.json packageManager.
        type: string
        default: ""
      frontend-commands:
        description: Commands run in the frontend directory after `bun install --frozen-lockfile`, one per line.
        type: string
        default: bun run build
      runs-on:
        type: string
        default: ubuntu-latest
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          cache: false
      - name: Go cache paths
        id: paths
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          # staticcheck keeps its own cache in os.UserCacheDir()/staticcheck unless STATICCHECK_CACHE is set.
          case "$(uname -s)" in Darwin) base="$HOME/Library/Caches" ;; *) base="${XDG_CACHE_HOME:-$HOME/.cache}" ;; esac
          echo "staticcheck=${STATICCHECK_CACHE:-$base/staticcheck}" >> "$GITHUB_OUTPUT"
          # Build caches are split per calling workflow file (the caller's ci.yml vs integration.yml)
          # and working-directory: a trimmed entry holds only what its own kind of run used.
          wf="${WORKFLOW_REF%%@*}"; wf="${wf##*/}"; wf="${wf%.*}"
          echo "scope=$(printf '%s-%s' "$wf" "$WORKDIR" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && format('go-mod-{0}-', runner.os) || '' }}
      - name: Restore Go build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.paths.outputs.build }}
            ${{ steps.paths.outputs.staticcheck }}
          key: go-lint-${{ runner.os }}-${{ steps.paths.outputs.scope }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ steps.paths.outputs.scope }}-${{ hashFiles('**/go.sum') }}-
            go-lint-${{ runner.os }}-${{ steps.paths.outputs.scope }}-
      - name: Mark Go build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        env:
          DIRS: |
            ${{ steps.paths.outputs.build }}
            ${{ steps.paths.outputs.staticcheck }}
        run: |
          # Go and staticcheck refresh an entry's mtime on use only when it is at least an hour
          # old, so the entries of a cache saved less than an hour ago would look unused. Age every
          # restored entry to two hours ago (far from their own 6-day trim cutoff), then set the
          # marker: at save time, an entry newer than the marker was used or written by this run.
          set -euo pipefail
          shopt -s nullglob
          old=$(( $(date +%s) - 7200 ))
          stamp=$(date -u -d "@$old" +%Y%m%d%H%M.%S 2>/dev/null || date -u -r "$old" +%Y%m%d%H%M.%S)
          TZ=UTC0 touch -t "$stamp" "$RUNNER_TEMP/go-cache-aged"
          while IFS= read -r dir; do
            sub=("${dir%/}"/[0-9a-f][0-9a-f])
            [ "${#sub[@]}" -gt 0 ] || continue
            find "${sub[@]}" -mindepth 1 -maxdepth 1 -name '*-[ad]' -exec touch -c -r "$RUNNER_TEMP/go-cache-aged" {} +
          done <<< "$DIRS"
          touch "$RUNNER_TEMP/go-cache-marker"
      - name: gofmt
        run: |
          # shellcheck disable=SC2046
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy -diff
        if: inputs.tidy-check
        run: go mod tidy -diff
      - name: go build
        env:
          FLAGS: ${{ inputs.build-flags }}
        run: |
          # shellcheck disable=SC2086
          go build $FLAGS ./...
      - name: go vet
        env:
          FLAGS: ${{ inputs.build-flags }}
        run: |
          # shellcheck disable=SC2086
          go vet $FLAGS ./...
      - name: staticcheck
        if: inputs.staticcheck != 'off'
        env:
          OVERRIDE: ${{ inputs.staticcheck-command }}
          VERSION: ${{ inputs.staticcheck-version }}
        run: |
          set -o pipefail
          if [ -n "$OVERRIDE" ]; then cmd="$OVERRIDE"
          elif grep -Eq '^[[:space:]]*(tool[[:space:]]+)?honnef\.co/go/tools/cmd/staticcheck[[:space:]]*$' go.mod; then cmd="go tool staticcheck"
          else cmd="go run honnef.co/go/tools/cmd/staticcheck@${VERSION}"; fi
          echo "running: $cmd"
          $cmd ./... 2>&1 | tee "$RUNNER_TEMP/staticcheck.log"
          # staticcheck exits 0 when it cannot load a package; those show up as "(compile)" lines.
          if grep -q '(compile)' "$RUNNER_TEMP/staticcheck.log"; then
            echo "::error::staticcheck could not analyse the module ((compile) errors)"; exit 1
          fi
      - name: govulncheck
        if: inputs.govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Trim Go build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        env:
          DIRS: |
            ${{ steps.paths.outputs.build }}
            ${{ steps.paths.outputs.staticcheck }}
        run: |
          # Delete the entries (<hash>-a action entries, <hash>-d outputs) this run did not use.
          # Go does not touch an output it stores again unchanged, so the outputs that a kept
          # action entry ("v1 <action> <output> ...") points at are kept as well.
          set -euo pipefail
          shopt -s nullglob
          export LC_ALL=C
          marker="$RUNNER_TEMP/go-cache-marker" keep="$RUNNER_TEMP/go-cache-keep"
          while IFS= read -r dir; do
            dir="${dir%/}"
            sub=("$dir"/[0-9a-f][0-9a-f])
            [ "${#sub[@]}" -gt 0 ] || continue
            before=$(du -sk "$dir" | cut -f1)
            find "${sub[@]}" -mindepth 1 -maxdepth 1 -type f -name '*-a' -newer "$marker" -exec cat {} + \
              | awk -v d="$dir" '$1 == "v1" && NF >= 3 { print d "/" substr($3, 1, 2) "/" $3 "-d" }' \
              | sort -u > "$keep"
            find "${sub[@]}" -mindepth 1 -maxdepth 1 -name '*-[ad]' ! -newer "$marker" | sort \
              | comm -23 - "$keep" | tr '\n' '\0' | xargs -0 rm -rf --
            echo "$dir: ${before} KiB -> $(du -sk "$dir" | cut -f1) KiB"
          done <<< "$DIRS"
      - name: Save Go build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.paths.outputs.build }}
            ${{ steps.paths.outputs.staticcheck }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Save Go module cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.mod }}
          key: ${{ steps.mod-cache.outputs.cache-primary-key }}

  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: ${{ inputs.redis-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          cache: false
      - name: Go cache paths
        id: paths
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          wf="${WORKFLOW_REF%%@*}"; wf="${wf##*/}"; wf="${wf%.*}"
          echo "scope=$(printf '%s-%s' "$wf" "$WORKDIR" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.mod }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && format('go-mod-{0}-', runner.os) || '' }}
      - name: Restore Go build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.build }}
          key: go-test-${{ runner.os }}-${{ steps.paths.outputs.scope }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ steps.paths.outputs.scope }}-${{ hashFiles('**/go.sum') }}-
            go-test-${{ runner.os }}-${{ steps.paths.outputs.scope }}-
      - name: Mark Go build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        env:
          DIRS: ${{ steps.paths.outputs.build }}
        run: |
          # Go and staticcheck refresh an entry's mtime on use only when it is at least an hour
          # old, so the entries of a cache saved less than an hour ago would look unused. Age every
          # restored entry to two hours ago (far from their own 6-day trim cutoff), then set the
          # marker: at save time, an entry newer than the marker was used or written by this run.
          set -euo pipefail
          shopt -s nullglob
          old=$(( $(date +%s) - 7200 ))
          stamp=$(date -u -d "@$old" +%Y%m%d%H%M.%S 2>/dev/null || date -u -r "$old" +%Y%m%d%H%M.%S)
          TZ=UTC0 touch -t "$stamp" "$RUNNER_TEMP/go-cache-aged"
          while IFS= read -r dir; do
            sub=("${dir%/}"/[0-9a-f][0-9a-f])
            [ "${#sub[@]}" -gt 0 ] || continue
            find "${sub[@]}" -mindepth 1 -maxdepth 1 -name '*-[ad]' -exec touch -c -r "$RUNNER_TEMP/go-cache-aged" {} +
          done <<< "$DIRS"
          touch "$RUNNER_TEMP/go-cache-marker"
      - name: Export env and service URLs
        env:
          LINES: ${{ inputs.env }}
        run: |
          pg="postgres://postgres:postgres@localhost:5432/test?sslmode=disable"
          rd="redis://localhost:6379/"
          { echo "CI_POSTGRES_URL=$pg"; echo "CI_REDIS_URL=$rd"; } >> "$GITHUB_ENV"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            line="${line//\$\{CI_POSTGRES_URL\}/$pg}"
            line="${line//\$\{CI_REDIS_URL\}/$rd}"
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$LINES"
      - name: go test
        env:
          FLAGS: ${{ inputs.build-flags }}
          RACE: ${{ inputs.race }}
          PKGS: ${{ inputs.test-packages }}
          ARGS: ${{ inputs.test-args }}
          COVERAGE: ${{ inputs.coverage }}
          EXCLUDE: ${{ inputs.coverpkg-exclude }}
        run: |
          set -euo pipefail
          extra=()
          [ "$RACE" = true ] && extra+=(-race)
          if [ "$COVERAGE" = true ]; then
            mkdir -p "$GITHUB_WORKSPACE/coverage"
            extra+=(-covermode=atomic "-coverprofile=$GITHUB_WORKSPACE/coverage/go.out")
            if [ -n "$EXCLUDE" ]; then
              extra+=("-coverpkg=$(go list ./... | grep -Ev "$EXCLUDE" | paste -sd, -)")
            fi
          fi
          # shellcheck disable=SC2086
          go test $FLAGS "${extra[@]}" $ARGS $PKGS
      - name: Merge repeated coverage blocks
        if: inputs.coverage && inputs.coverpkg-exclude != ''
        run: |
          # With -coverpkg every test binary reports every listed package, so go.out repeats each
          # block once per tested package. Write each block once (first-seen order) with the counts
          # summed (OR in set mode): go tool cover merges repeats the same way when it reads the
          # profile, and Sonar marks a line covered when any block on it has a count > 0, so both
          # totals stay the same. On an unexpected line the profile is left as it is.
          f="$GITHUB_WORKSPACE/coverage/go.out"
          if awk 'NR == 1 { if ($0 !~ /^mode: /) exit 1; set = ($0 == "mode: set"); print; next }
                  NF == 0 { next }
                  NF != 3 || $3 !~ /^[0-9]+$/ { exit 1 }
                  { k = $1 " " $2; if (!(k in n)) { o[++c] = k; n[k] = 0 }
                    n[k] = set ? (n[k] + $3 > 0) : n[k] + $3 }
                  END { for (i = 1; i <= c; i++) printf "%s %.0f\n", o[i], n[o[i]] }' "$f" > "$f.merged"; then
            echo "go.out: $(wc -l < "$f") -> $(wc -l < "$f.merged") lines"
            mv "$f.merged" "$f"
          else
            rm -f "$f.merged"; echo "::warning::coverage/go.out has an unexpected line; left unmerged"
          fi
      - name: Coverage threshold
        if: inputs.coverage && inputs.coverage-threshold != ''
        env:
          MIN: ${{ inputs.coverage-threshold }}
        run: |
          total=$(go tool cover -func="$GITHUB_WORKSPACE/coverage/go.out" | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}% (minimum ${MIN}%)"
          awk -v t="$total" -v m="$MIN" 'BEGIN { exit !(t+0 >= m+0) }' || { echo "::error::coverage ${total}% < ${MIN}%"; exit 1; }
      - name: Upload coverage
        if: inputs.coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage/
          retention-days: 3
          if-no-files-found: error
      - name: Trim Go build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        env:
          DIRS: ${{ steps.paths.outputs.build }}
        run: |
          # Delete the entries (<hash>-a action entries, <hash>-d outputs) this run did not use.
          # Go does not touch an output it stores again unchanged, so the outputs that a kept
          # action entry ("v1 <action> <output> ...") points at are kept as well.
          set -euo pipefail
          shopt -s nullglob
          export LC_ALL=C
          marker="$RUNNER_TEMP/go-cache-marker" keep="$RUNNER_TEMP/go-cache-keep"
          while IFS= read -r dir; do
            dir="${dir%/}"
            sub=("$dir"/[0-9a-f][0-9a-f])
            [ "${#sub[@]}" -gt 0 ] || continue
            before=$(du -sk "$dir" | cut -f1)
            find "${sub[@]}" -mindepth 1 -maxdepth 1 -type f -name '*-a' -newer "$marker" -exec cat {} + \
              | awk -v d="$dir" '$1 == "v1" && NF >= 3 { print d "/" substr($3, 1, 2) "/" $3 "-d" }' \
              | sort -u > "$keep"
            find "${sub[@]}" -mindepth 1 -maxdepth 1 -name '*-[ad]' ! -newer "$marker" | sort \
              | comm -23 - "$keep" | tr '\n' '\0' | xargs -0 rm -rf --
            echo "$dir: ${before} KiB -> $(du -sk "$dir" | cut -f1) KiB"
          done <<< "$DIRS"
      - name: Save Go build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.build }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  frontend:
    name: Frontend
    if: inputs.frontend-directory != ''
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.frontend-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
          bun-version-file: ${{ inputs.bun-version == '' && format('{0}/package.json', inputs.frontend-directory) || '' }}
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Frontend checks
        env:
          COMMANDS: ${{ inputs.frontend-commands }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "::group::$cmd"; eval "$cmd"; echo "::endgroup::"
          done <<< "$COMMANDS"
