# Reusable maturin wheel build (PyO3 / Rust extension modules). One job per
# target x variant; uploads artifacts `wheels-<variant>-<label>` (+ `wheels-sdist-<variant>`),
# retention 3 days. Publishing stays in the caller workflow because PyPI trusted
# publishing does not accept tokens minted inside a reusable workflow.
#
# Interpreter selection (`interpreters`, overridable per target):
#   ""        maturin default. Right for abi3 crates (pyo3 feature `abi3-py39`): one wheel.
#   "find"    --find-interpreter: one wheel per interpreter found. Needed for crates that are
#             NOT abi3. Linux targets build in the manylinux container and find its Pythons;
#             macOS/Windows find what `setup-python-versions` installed on the runner.
#   "3.9 3.14t"  explicit list (-i). Only abi3 crates get a usable cp39 wheel from this.
# The smoke test installs the built wheel into `python-version` (installed last, so it is the
# default `python`), so a wheel for that interpreter must exist on tested targets.
#
# `targets` is a JSON list. Each entry:
#   label         asset label, e.g. linux-x64                              (required)
#   os            runner (ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest) (required)
#   target        maturin target (x86_64, aarch64, x86_64-apple-darwin, ...)  (required)
#   manylinux     manylinux policy for Linux (default: inputs.manylinux)
#   interpreters  per-target override of `interpreters` (e.g. "3.14t" on a manylinux 2_28 leg)
#   test          false to skip the install/import smoke test and test-command (cross builds,
#                 no wheel for python-version); omitted or true = tested
name: Maturin wheels

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with pyproject.toml (maturin project).
        type: string
        default: "."
      targets:
        type: string
        default: >-
          [{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64"},
           {"label":"linux-arm64","os":"ubuntu-24.04-arm","target":"aarch64"},
           {"label":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},
           {"label":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin","test":false},
           {"label":"windows-x64","os":"windows-latest","target":"x64"}]
      variants:
        description: JSON list of package variants; each job gets WHEEL_VARIANT for configure-command. '[""]' = single package.
        type: string
        default: '[""]'
      configure-command:
        description: Shell run before building (e.g. rewrite the package name per variant). Env WHEEL_VARIANT, VERSION.
        type: string
        default: ""
      version:
        description: Version passed to configure-command as VERSION.
        type: string
        default: ""
      interpreters:
        description: '"" (maturin default, abi3) | "find" (--find-interpreter) | space-separated list for -i. See header.'
        type: string
        default: ""
      setup-python-versions:
        description: >-
          Extra Pythons installed on macOS/Windows runners before the build (space- or newline-separated),
          e.g. "3.9 3.10 3.11 3.12 3.13 3.14 3.14t" together with interpreters "find". Linux builds use the
          manylinux container's interpreters and ignore this.
        type: string
        default: ""
      args:
        description: Extra maturin build args (e.g. --features python).
        type: string
        default: ""
      manylinux:
        type: string
        default: auto
      before-script-linux:
        description: >-
          Script run inside the manylinux container before building (system deps). {target} and
          {variant} are substituted, e.g. `if [ "{variant}" = skia ]; then bash deps.sh {target}; fi`.
        type: string
        default: ""
      sdist:
        type: boolean
        default: true
      smoke-import:
        description: Module to import after installing the built wheel (empty = no smoke test).
        type: string
        default: ""
      test-command:
        description: Shell run after the smoke install (working-directory), e.g. "pip install pytest && pytest tests". Needs smoke-import.
        type: string
        default: ""
      python-version:
        description: Python used for the smoke test.
        type: string
        default: "3.13"
      timeout-minutes:
        type: number
        default: 45

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.variant && format('{0} ', matrix.variant) || '' }}${{ matrix.t.label }}
    runs-on: ${{ matrix.t.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(inputs.targets) }}
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python versions
        id: py
        shell: bash
        env:
          EXTRA: ${{ runner.os != 'Linux' && inputs.setup-python-versions || '' }}
          SMOKE: ${{ inputs.python-version }}
        run: |
          # the smoke-test Python goes last so it becomes the default `python`
          {
            echo "list<<__EOF__"
            for v in $EXTRA; do [ "$v" = "$SMOKE" ] || echo "$v"; done
            echo "$SMOKE"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.py.outputs.list }}
          allow-prereleases: true
      - name: Configure package
        if: inputs.configure-command != ''
        shell: bash
        env:
          WHEEL_VARIANT: ${{ matrix.variant }}
          VERSION: ${{ inputs.version }}
        run: ${{ inputs.configure-command }}
      - name: Interpreter args
        id: interp
        shell: bash
        env:
          INTERPRETERS: ${{ matrix.t.interpreters || inputs.interpreters }}
          ARGS: ${{ inputs.args }}
          BEFORE: ${{ inputs.before-script-linux }}
          TARGET: ${{ matrix.t.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          args="--release --locked --out dist $ARGS"
          case "$INTERPRETERS" in
            "") ;;
            find) args="$args --find-interpreter" ;;
            *) args="$args -i $INTERPRETERS" ;;
          esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
          before="${BEFORE//\{target\}/$TARGET}"; before="${before//\{variant\}/$VARIANT}"
          { echo "before<<__EOF__"; echo "$before"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ inputs.working-directory }}
          target: ${{ matrix.t.target }}
          manylinux: ${{ matrix.t.manylinux || inputs.manylinux }}
          args: ${{ steps.interp.outputs.args }}
          before-script-linux: ${{ steps.interp.outputs.before }}
          sccache: false
      - name: Smoke test
        if: inputs.smoke-import != '' && toJSON(matrix.t.test) != 'false'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          MODULE: ${{ inputs.smoke-import }}
        run: |
          pkg=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          python -m pip install --no-index --find-links dist --only-binary=:all: "$pkg"
          python -c "import $MODULE; print('$MODULE imported OK')"
      - name: Wheel tests
        if: inputs.smoke-import != '' && inputs.test-command != '' && toJSON(matrix.t.test) != 'false'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.variant || 'default' }}-${{ matrix.t.label }}
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 3
          if-no-files-found: error

  sdist:
    name: sdist ${{ matrix.variant }}
    if: inputs.sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure package
        if: inputs.configure-command != ''
        shell: bash
        env:
          WHEEL_VARIANT: ${{ matrix.variant }}
          VERSION: ${{ inputs.version }}
        run: ${{ inputs.configure-command }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ inputs.working-directory }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist-${{ matrix.variant || 'default' }}
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 3
          if-no-files-found: error
