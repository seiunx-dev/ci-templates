# Reusable workflow linter (actionlint + shellcheck on run: blocks). Cheap (~10 s); add it
# to every repo's CI so invalid YAML/expressions fail on the PR instead of silently
# producing zero-job runs.
name: Workflow lint

on:
  workflow_call:
    inputs:
      actionlint-version:
        type: string
        default: 1.7.12

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: actionlint@${{ inputs.actionlint-version }}
      - name: actionlint
        run: actionlint -color
