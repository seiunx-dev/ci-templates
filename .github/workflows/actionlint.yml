# Reusable workflow linter (actionlint + shellcheck on run: blocks; shellcheck comes with the runner image). Cheap (~10 s); add it
# to every repo's CI so invalid YAML/expressions fail on the PR instead of silently
# producing zero-job runs.
name: Workflow lint

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: actionlint release (without the v), downloaded from rhysd/actionlint and checked against its checksums file.
        type: string
        default: 1.7.12

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # taiki-e/install-action has no actionlint support (it falls back to cargo-binstall,
      # which cannot find it), so download the release binary and verify its checksum.
      - name: Install actionlint ${{ inputs.actionlint-version }}
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          file="actionlint_${VERSION}_linux_${arch}.tar.gz"
          dir="$RUNNER_TEMP/actionlint"; mkdir -p "$dir"; cd "$dir"
          curl -fsSL --retry 3 -o "$file" "$base/$file"
          curl -fsSL --retry 3 -o checksums.txt "$base/actionlint_${VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" actionlint
          echo "$dir" >> "$GITHUB_PATH"
      - name: actionlint
        run: |
          shellcheck --version
          actionlint -version
          actionlint -color
