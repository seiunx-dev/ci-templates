# Reusable frontend / Node CI for bun, npm or pnpm projects: `check` (install with the
# lockfile, then lint, typecheck, unit tests, build) and an optional Playwright `e2e`
# job with a cached browser download.
#
# E2E runs after `check` passes by default. `e2e-needs-check: false` starts it in parallel
# (shorter wall time; it then also runs when check fails). `e2e-events` limits it to some
# events (e.g. `pull_request`), and `e2e-paths` skips its steps when no matching file changed
# (a git diff inside the job; no extra job).
#
# Each command input accepts `auto` (run `<pm> run <script>` when package.json has that
# script), an explicit command, or '' to skip.
name: Node CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      package-manager:
        description: "auto (from lockfile) | bun | npm | pnpm"
        type: string
        default: auto
      node-version:
        description: Node version (also used with bun for tools that need node). Empty = .nvmrc / .node-version when present, else 24.
        type: string
        default: ""
      bun-version:
        description: Bun version (e.g. 1.3.14). Empty = .bun-version or package.json packageManager.
        type: string
        default: ""
      install-command:
        description: Override the install command (default = frozen-lockfile install for the package manager).
        type: string
        default: ""
      lint-command:
        type: string
        default: auto
      typecheck-command:
        type: string
        default: auto
      test-command:
        description: "auto runs the `test` script. For coverage, pass e.g. `bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage`."
        type: string
        default: auto
      build-command:
        type: string
        default: auto
      coverage-path:
        description: Coverage file to upload as coverage-js (e.g. coverage/lcov.info). It is renamed to lcov-js.info.
        type: string
        default: ""
      e2e-command:
        description: Playwright command (empty = no e2e job), e.g. "bunx playwright test".
        type: string
        default: ""
      e2e-prepare-command:
        description: Shell run before the e2e command (e.g. a build the tests serve).
        type: string
        default: ""
      e2e-browsers:
        description: Playwright browsers to install (space-separated).
        type: string
        default: chromium
      e2e-xvfb:
        description: Wrap the e2e command in xvfb-run (headed WebGL tests).
        type: boolean
        default: false
      e2e-system-deps:
        description: "When to apt-install the browsers' system packages (fonts included): always (every run, as `playwright install --with-deps` / `install-deps`) or when-missing (only when a browser fails to launch; hosted runners already carry Chromium's libraries)."
        type: string
        default: always
      upload-build:
        description: Path of build output to upload as artifact `build` (retention 3 days). Empty = no upload.
        type: string
        default: ""
      runs-on:
        type: string
        default: ubuntu-latest
      timeout-minutes:
        type: number
        default: 15
      e2e-timeout-minutes:
        type: number
        default: 20
      e2e-needs-check:
        description: "true: E2E starts after Check passes. false: E2E runs in parallel with Check (it then also runs when Check fails)."
        type: boolean
        default: true
      e2e-events:
        description: "Space-separated event names E2E runs on (e.g. `pull_request`); empty = every event. Other events skip the E2E job."
        type: string
        default: ""
      e2e-paths:
        description: "Glob patterns (one per line, ** allowed, repository-root relative). When set, E2E on pull_request / push runs its steps only if a matching file changed; other events always run."
        type: string
        default: ""
      npm-fetch-timeout:
        description: "npm fetch-timeout in ms for the install step (NPM_CONFIG_FETCH_TIMEOUT; npm's default is 300000). Empty = unset."
        type: string
        default: ""
      npm-fetch-retries:
        description: "npm fetch-retries for the install step (NPM_CONFIG_FETCH_RETRIES; npm's default is 2). Empty = unset."
        type: string
        default: ""
      npm-audit:
        description: "Run npm's install-time audit in the default `npm ci`; false exports NPM_CONFIG_AUDIT=false (= `npm ci --no-audit`), true leaves .npmrc / npm defaults alone. No effect with install-command."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect package manager
        id: pm
        env:
          PM: ${{ inputs.package-manager }}
          NODE: ${{ inputs.node-version }}
        run: |
          pm="$PM"
          if [ "$pm" = auto ]; then
            if [ -f bun.lock ] || [ -f bun.lockb ]; then pm=bun
            elif [ -f pnpm-lock.yaml ]; then pm=pnpm
            else pm=npm; fi
          fi
          node="$NODE"
          if [ -z "$node" ]; then
            if [ -f .nvmrc ]; then node="$(cat .nvmrc)"; elif [ -f .node-version ]; then node="$(cat .node-version)"; else node=24; fi
          fi
          echo "pm=$pm" >> "$GITHUB_OUTPUT"; echo "node=$node" >> "$GITHUB_OUTPUT"
      - name: Check e2e-events
        # the E2E job matches the list as plain text: a comma or newline would silently skip it
        if: inputs.e2e-events != ''
        env:
          EVENTS: ${{ inputs.e2e-events }}
        run: |
          re='^[a-z_ ]+$'
          if ! [[ "$EVENTS" =~ $re ]]; then
            echo "::error::e2e-events must be space-separated event names (e.g. 'pull_request push'), got '$EVENTS'"; exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pm.outputs.node }}
          cache: ${{ steps.pm.outputs.pm != 'bun' && steps.pm.outputs.pm || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.pm == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Setup pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        run: corepack enable pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.pm.outputs.pm == 'bun'
        with:
          bun-version: ${{ inputs.bun-version }}
          bun-version-file: ${{ inputs.bun-version == '' && format('{0}/package.json', inputs.working-directory) || '' }}
      - name: Install dependencies
        env:
          PM: ${{ steps.pm.outputs.pm }}
          INSTALL: ${{ inputs.install-command }}
          FETCH_TIMEOUT: ${{ inputs.npm-fetch-timeout }}
          FETCH_RETRIES: ${{ inputs.npm-fetch-retries }}
          AUDIT: ${{ inputs.npm-audit }}
        run: |
          if ! [[ "$FETCH_TIMEOUT$FETCH_RETRIES" =~ ^[0-9]*$ ]]; then
            echo "::error::npm-fetch-timeout and npm-fetch-retries must be whole numbers"; exit 1
          fi
          # npm reads NPM_CONFIG_* case-insensitively; unset unless given, since an empty
          # variable would override .npmrc with ''
          if [ -n "$FETCH_TIMEOUT" ]; then export NPM_CONFIG_FETCH_TIMEOUT="$FETCH_TIMEOUT"; fi
          if [ -n "$FETCH_RETRIES" ]; then export NPM_CONFIG_FETCH_RETRIES="$FETCH_RETRIES"; fi
          if [ -n "$INSTALL" ]; then eval "$INSTALL"; exit 0; fi
          # npm-audit: false makes the template's own npm ci skip the install-time audit
          # (= --no-audit); true (the default) leaves .npmrc / npm defaults in charge
          if [ "$PM" = npm ] && [ "$AUDIT" != true ]; then export NPM_CONFIG_AUDIT=false; fi
          case "$PM" in
            bun) bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: Lint, typecheck, test, build
        env:
          PM: ${{ steps.pm.outputs.pm }}
          LINT: ${{ inputs.lint-command }}
          TYPECHECK: ${{ inputs.typecheck-command }}
          TEST: ${{ inputs.test-command }}
          BUILD: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          run_step() {
            local label="$1" cmd="$2" script="$3"
            if [ "$cmd" = auto ]; then
              if jq -e --arg s "$script" '.scripts[$s] // empty' package.json >/dev/null; then cmd="$PM run $script"; else cmd=""; fi
            fi
            [ -n "$cmd" ] || { echo "skip $label"; return 0; }
            echo "::group::$label: $cmd"; eval "$cmd"; echo "::endgroup::"
          }
          run_step lint "$LINT" lint
          run_step typecheck "$TYPECHECK" typecheck
          run_step test "$TEST" test
          run_step build "$BUILD" build
      - name: Stage coverage
        if: inputs.coverage-path != ''
        env:
          SRC: ${{ inputs.coverage-path }}
        run: mkdir -p "$GITHUB_WORKSPACE/coverage-js" && cp "$SRC" "$GITHUB_WORKSPACE/coverage-js/lcov-js.info"
      - name: Upload coverage
        if: inputs.coverage-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: coverage-js/
          retention-days: 3
          if-no-files-found: error
      - name: Upload build
        if: inputs.upload-build != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: ${{ inputs.working-directory }}/${{ inputs.upload-build }}
          retention-days: 3
          if-no-files-found: error

  # Two variants of the same E2E job: after Check (default) or in parallel with it
  # (e2e-needs-check: false). `needs` cannot be conditional, so the steps are shared through a
  # YAML anchor, as in rust-ci. The parallel variant has its own name so that the default
  # path never shows two check runs called "E2E".
  e2e:
    name: E2E
    if: inputs.e2e-command != '' && inputs.e2e-needs-check && (inputs.e2e-events == '' || contains(format(' {0} ', inputs.e2e-events), format(' {0} ', github.event_name)))
    needs: check
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.e2e-timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # e2e-paths on a PR diffs the merge commit against its first parent (the base head)
          fetch-depth: ${{ (inputs.e2e-paths != '' && github.event_name == 'pull_request') && 2 || 1 }}
      - name: Changed paths
        id: paths
        if: inputs.e2e-paths != ''
        env:
          PATTERNS: ${{ inputs.e2e-paths }}
          BEFORE: ${{ github.event.before }}
          TOKEN: ${{ github.token }}
        run: |
          # Fails open: whenever there is no base to diff against, the tests run.
          decide() {
            local run="$1"
            echo "run=$run" >> "$GITHUB_OUTPUT"
            [ "$run" = true ] || echo "::notice::E2E skipped: no changed file matches e2e-paths"
            exit 0
          }
          base=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # the checkout is the PR's merge commit; its first parent is the base branch head
              if git rev-parse -q --verify 'HEAD^2' >/dev/null; then base=$(git rev-parse 'HEAD^1'); fi ;;
            push)
              # `before` is all zeros for a new branch; checkout left no credentials, so pass the
              # token for this one fetch through the environment (not argv, not .git/config)
              if [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ]; then
                auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
                if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="$auth" \
                  git fetch -q --no-tags --depth=1 origin "$BEFORE"; then base=$BEFORE; fi
              fi ;;
            *) ;; # other events have no base to diff against
          esac
          if [ -z "$base" ]; then echo "no base commit for $GITHUB_EVENT_NAME; running E2E"; decide true; fi
          files=$(git diff --name-only --no-renames "$base" HEAD) || decide true
          # same matching as docker.yml pr-paths: bash patterns, where * also matches /
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            while IFS= read -r p; do
              p="${p#"${p%%[![:space:]]*}"}"; p="${p%"${p##*[![:space:]]}"}"
              [ -n "$p" ] || continue
              # shellcheck disable=SC2053
              if [[ "$f" == $p ]]; then echo "$f matches $p"; decide true; fi
            done <<< "$PATTERNS"
          done <<< "$files"
          decide false
      - name: Detect package manager
        if: steps.paths.outputs.run != 'false'
        id: pm
        env:
          PM: ${{ inputs.package-manager }}
          NODE: ${{ inputs.node-version }}
        run: |
          pm="$PM"
          if [ "$pm" = auto ]; then
            if [ -f bun.lock ] || [ -f bun.lockb ]; then pm=bun
            elif [ -f pnpm-lock.yaml ]; then pm=pnpm
            else pm=npm; fi
          fi
          node="$NODE"
          if [ -z "$node" ]; then
            if [ -f .nvmrc ]; then node="$(cat .nvmrc)"; elif [ -f .node-version ]; then node="$(cat .node-version)"; else node=24; fi
          fi
          echo "pm=$pm" >> "$GITHUB_OUTPUT"; echo "node=$node" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.paths.outputs.run != 'false'
        with:
          node-version: ${{ steps.pm.outputs.node }}
          cache: ${{ steps.pm.outputs.pm != 'bun' && steps.pm.outputs.pm || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.pm == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Setup pnpm
        if: steps.paths.outputs.run != 'false' && (steps.pm.outputs.pm == 'pnpm')
        run: corepack enable pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.paths.outputs.run != 'false' && (steps.pm.outputs.pm == 'bun')
        with:
          bun-version: ${{ inputs.bun-version }}
          bun-version-file: ${{ inputs.bun-version == '' && format('{0}/package.json', inputs.working-directory) || '' }}
      - name: Install dependencies
        if: steps.paths.outputs.run != 'false'
        env:
          PM: ${{ steps.pm.outputs.pm }}
          INSTALL: ${{ inputs.install-command }}
          FETCH_TIMEOUT: ${{ inputs.npm-fetch-timeout }}
          FETCH_RETRIES: ${{ inputs.npm-fetch-retries }}
          AUDIT: ${{ inputs.npm-audit }}
        run: |
          if ! [[ "$FETCH_TIMEOUT$FETCH_RETRIES" =~ ^[0-9]*$ ]]; then
            echo "::error::npm-fetch-timeout and npm-fetch-retries must be whole numbers"; exit 1
          fi
          # npm reads NPM_CONFIG_* case-insensitively; unset unless given, since an empty
          # variable would override .npmrc with ''
          if [ -n "$FETCH_TIMEOUT" ]; then export NPM_CONFIG_FETCH_TIMEOUT="$FETCH_TIMEOUT"; fi
          if [ -n "$FETCH_RETRIES" ]; then export NPM_CONFIG_FETCH_RETRIES="$FETCH_RETRIES"; fi
          if [ -n "$INSTALL" ]; then eval "$INSTALL"; exit 0; fi
          # npm-audit: false makes the template's own npm ci skip the install-time audit
          # (= --no-audit); true (the default) leaves .npmrc / npm defaults in charge
          if [ "$PM" = npm ] && [ "$AUDIT" != true ]; then export NPM_CONFIG_AUDIT=false; fi
          case "$PM" in
            bun) bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
          esac
      - name: Playwright version
        if: steps.paths.outputs.run != 'false'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: steps.paths.outputs.run != 'false'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.e2e-browsers }}
      - name: Apt timeouts
        # a stalled mirror (archive.ubuntu.com / azure) holds each package for the default
        # timeout before apt moves on; fail over sooner and retry instead
        if: steps.paths.outputs.run != 'false' && (runner.os == 'Linux')
        env:
          DEPS: ${{ inputs.e2e-system-deps }}
        run: |
          case "$DEPS" in always|when-missing) ;; *) echo "::error::e2e-system-deps must be always or when-missing, got '$DEPS'"; exit 1 ;; esac
          SUDO=""
          if [ "$(id -u)" != 0 ]; then SUDO=sudo; fi
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | $SUDO tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
      - name: Install browsers
        if: steps.paths.outputs.run != 'false' && (steps.pw-cache.outputs.cache-hit != 'true')
        env:
          BROWSERS: ${{ inputs.e2e-browsers }}
          DEPS: ${{ inputs.e2e-system-deps }}
        run: |
          # the project's own Playwright CLI (npx could fetch an unpinned one)
          pw="$(node -p "require.resolve('@playwright/test/cli')")"
          # shellcheck disable=SC2086
          if [ "$DEPS" = when-missing ]; then node "$pw" install $BROWSERS; else node "$pw" install --with-deps $BROWSERS; fi
      - name: Install browser system deps
        if: steps.paths.outputs.run != 'false' && (steps.pw-cache.outputs.cache-hit == 'true' || inputs.e2e-system-deps == 'when-missing')
        env:
          BROWSERS: ${{ inputs.e2e-browsers }}
          DEPS: ${{ inputs.e2e-system-deps }}
          XVFB: ${{ inputs.e2e-xvfb }}
        run: |
          # when-missing: launch each browser the way the tests will (headed under xvfb with
          # e2e-xvfb); apt only for the ones that don't start. Other names (chrome, msedge …)
          # always get their packages.
          need=""
          for b in $BROWSERS; do
            if [ "$DEPS" = when-missing ]; then
              case "$b" in
                chromium|firefox|webkit)
                  probe=(node -e "require('@playwright/test')[process.argv[1]].launch({ headless: process.env.XVFB !== 'true' }).then((x) => x.close()).catch((e) => { console.error(e.message.split('\\n')[0]); process.exit(1); })" "$b")
                  if [ "$XVFB" = true ]; then probe=(xvfb-run --auto-servernum "${probe[@]}"); fi
                  if timeout 120 "${probe[@]}"; then echo "$b launches: no system packages needed"; continue; fi ;;
              esac
            fi
            need="$need $b"
          done
          if [ -z "$need" ]; then exit 0; fi
          # shellcheck disable=SC2086
          node "$(node -p "require.resolve('@playwright/test/cli')")" install-deps $need
      - name: E2E prepare
        if: steps.paths.outputs.run != 'false' && (inputs.e2e-prepare-command != '')
        run: ${{ inputs.e2e-prepare-command }}
      - name: E2E tests
        if: steps.paths.outputs.run != 'false'
        env:
          XVFB: ${{ inputs.e2e-xvfb }}
          CMD: ${{ inputs.e2e-command }}
        run: |
          if [ "$XVFB" = true ]; then eval "xvfb-run --auto-servernum $CMD"; else eval "$CMD"; fi
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: |
            ${{ inputs.working-directory }}/test-results/
            ${{ inputs.working-directory }}/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  e2e-parallel:
    name: E2E (parallel)
    if: inputs.e2e-command != '' && !inputs.e2e-needs-check && (inputs.e2e-events == '' || contains(format(' {0} ', inputs.e2e-events), format(' {0} ', github.event_name)))
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.e2e-timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps: *e2e-steps
