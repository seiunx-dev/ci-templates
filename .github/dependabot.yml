version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Shanghai
    commit-message:
      prefix: "[Chore] "
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 3
