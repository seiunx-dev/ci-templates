name: Cargo publish
description: >-
  Publish crates to crates.io in the given order, idempotently: a version that is already
  on the index is skipped, and each crate waits for the index before the next one is
  published (core -> cli style workspaces). The token only reaches the publish commands.
inputs:
  packages:
    description: Crate names in publish order, one per line.
    required: true
  token:
    description: crates.io token (secret CARGO_REGISTRY_TOKEN, or the output of rust-lang/crates-io-auth-action).
    required: true
  dry-run:
    description: "'true' runs cargo publish --dry-run only."
    default: "false"
  index-wait-attempts:
    description: How many 15 s polls to wait for each crate to appear on the index.
    default: "40"
runs:
  using: composite
  steps:
    - name: Publish crates
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        DRY_RUN: ${{ inputs.dry-run }}
        ATTEMPTS: ${{ inputs.index-wait-attempts }}
        REGISTRY_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        meta="$(cargo metadata --no-deps --format-version 1)"
        while IFS= read -r pkg; do
          pkg="$(echo "$pkg" | tr -d '[:space:]')"; [ -n "$pkg" ] || continue
          ver="$(jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version' <<< "$meta")"
          [ -n "$ver" ] || { echo "::error::package $pkg not in workspace"; exit 1; }
          if cargo info "$pkg@$ver" --registry crates-io >/dev/null 2>&1; then
            echo "$pkg $ver already on crates.io, skipping"; continue
          fi
          if [ "$DRY_RUN" = true ]; then
            cargo publish --locked --dry-run -p "$pkg"; continue
          fi
          CARGO_REGISTRY_TOKEN="$REGISTRY_TOKEN" cargo publish --locked -p "$pkg"
          for i in $(seq 1 "$ATTEMPTS"); do
            if cargo info "$pkg@$ver" --registry crates-io >/dev/null 2>&1; then echo "$pkg $ver visible on index"; break; fi
            [ "$i" = "$ATTEMPTS" ] && { echo "::error::$pkg $ver not visible on the index"; exit 1; }
            sleep 15
          done
        done <<< "$PACKAGES"
