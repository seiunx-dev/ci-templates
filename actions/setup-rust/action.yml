name: Setup Rust
description: >-
  Install a Rust toolchain and restore Swatinem/rust-cache. The toolchain comes from the
  `toolchain` input, else the channel in rust-toolchain(.toml), else stable. The cache is
  saved only from the default branch (PRs and tags restore, never write).
inputs:
  toolchain:
    description: Toolchain override (e.g. 1.98.0). Empty = rust-toolchain(.toml) channel, else stable.
    default: ""
  components:
    description: Comma-separated rustup components (e.g. rustfmt,clippy).
    default: ""
  targets:
    description: Comma-separated extra targets (e.g. wasm32-unknown-unknown).
    default: ""
  working-directory:
    description: Directory that holds rust-toolchain(.toml) and the main Cargo project.
    default: "."
  cache:
    description: Restore/save Swatinem/rust-cache.
    default: "true"
  cache-key:
    description: rust-cache shared-key. Use one key per job purpose (lint, test, coverage, release-<label>).
    default: ""
  cache-workspaces:
    description: rust-cache workspaces ("dir -> target" per line). Empty = "<working-directory> -> target".
    default: ""
  cache-save:
    description: "'auto' saves only on the default branch; 'true'/'false' force it."
    default: auto
  cache-all-crates:
    description: Pass-through to rust-cache (keep installed crates such as cargo-llvm-cov).
    default: "false"
outputs:
  toolchain:
    description: The resolved toolchain.
    value: ${{ steps.resolve.outputs.toolchain }}
runs:
  using: composite
  steps:
    - name: Resolve toolchain
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        tc="$INPUT_TOOLCHAIN"
        if [ -z "$tc" ] && [ -f rust-toolchain.toml ]; then
          tc=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
        elif [ -z "$tc" ] && [ -f rust-toolchain ]; then
          tc=$(head -n1 rust-toolchain | tr -d '[:space:]')
        fi
        echo "toolchain=${tc:-stable}" >> "$GITHUB_OUTPUT"
        echo "Rust toolchain: ${tc:-stable}"

    - name: Install Rust ${{ steps.resolve.outputs.toolchain }}
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Compute cache options
      id: cache
      if: inputs.cache == 'true'
      shell: bash
      env:
        WORKSPACES: ${{ inputs.cache-workspaces }}
        WORKDIR: ${{ inputs.working-directory }}
        SAVE: ${{ inputs.cache-save }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        ws="$WORKSPACES"
        [ -n "$ws" ] || ws="$WORKDIR -> target"
        { echo "workspaces<<__WS__"; echo "$ws"; echo "__WS__"; } >> "$GITHUB_OUTPUT"
        save="$SAVE"
        if [ "$save" = auto ]; then
          if [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH:-main}" ]; then save=true; else save=false; fi
        fi
        echo "save=$save" >> "$GITHUB_OUTPUT"

    - name: Rust cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        workspaces: ${{ steps.cache.outputs.workspaces }}
        save-if: ${{ steps.cache.outputs.save }}
        cache-all-crates: ${{ inputs.cache-all-crates }}
